<!doctype html><html><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;cursor:crosshair;font-family:"Segoe UI","Microsoft YaHei",sans-serif}#screen{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;user-select:none}#veil{position:fixed;inset:0;background:rgba(5,8,18,.44)}#selection{display:none;position:fixed;border:2px solid #8d9aff;box-shadow:0 0 0 9999px rgba(5,8,18,.48),0 0 25px rgba(96,112,255,.45);background:transparent}#size{position:absolute;left:-2px;top:-29px;padding:4px 8px;border-radius:6px;background:#151a2c;color:#edf1ff;font-size:11px;white-space:nowrap}.hint{position:fixed;left:50%;top:28px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;background:rgba(16,20,37,.9);color:#dce3fa;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
</style></head><body><img id="screen"><div id="veil"></div><div id="selection"><span id="size"></span></div><div class="hint">拖拽选择截图区域 · Esc 取消</div><script>
const image=document.getElementById('screen'),box=document.getElementById('selection'),size=document.getElementById('size');let start=null,drag=false;
window.selector.onImage(src=>image.src=src);
addEventListener('mousedown',e=>{start={x:e.clientX,y:e.clientY};drag=true;box.style.display='block'});
addEventListener('mousemove',e=>{if(!drag)return;const x=Math.min(start.x,e.clientX),y=Math.min(start.y,e.clientY),w=Math.abs(e.clientX-start.x),h=Math.abs(e.clientY-start.y);Object.assign(box.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});size.textContent=`${Math.round(w)} × ${Math.round(h)}`});
addEventListener('mouseup',e=>{if(!drag)return;drag=false;const rect=box.getBoundingClientRect();window.selector.complete({x:rect.x,y:rect.y,width:rect.width,height:rect.height})});
addEventListener('keydown',e=>{if(e.key==='Escape')window.selector.cancel()});
</script></body></html>
